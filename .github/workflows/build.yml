name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Linux ──────────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            libglfw3-dev \
            libgl1-mesa-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev \
            xxd

      - name: Download Inter font
        run: |
          curl -sL "https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip" -o /tmp/inter.zip
          unzip -j /tmp/inter.zip "*/Inter-Regular.ttf" "*/Inter-Bold.ttf" -d assets/fonts/

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: build-log.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pop-maker-studio-linux
          path: |
            build/pop-maker-studio
            build/ml_pipeline.py

  # ── macOS ──────────────────────────────────────────────────────────────────
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja glfw ffmpeg

      - name: Download Inter font
        run: |
          curl -sL "https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip" -o /tmp/inter.zip
          unzip -j /tmp/inter.zip "*/Inter-Regular.ttf" "*/Inter-Bold.ttf" -d assets/fonts/

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pop-maker-studio-macos
          path: |
            build/pop-maker-studio
            build/ml_pipeline.py

  # ── Windows ────────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'a42af01b72c28a8e1d7b48107b33e4f286a55ef6'

      - name: Install dependencies via vcpkg
        run: vcpkg install glfw3 ffmpeg --triplet x64-windows

      - name: Download Inter font
        run: |
          Invoke-WebRequest -Uri "https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip" -OutFile inter.zip
          Expand-Archive -Path inter.zip -DestinationPath inter_tmp
          $regular = Get-ChildItem -Recurse -Filter "Inter-Regular.ttf" inter_tmp | Select-Object -First 1
          $bold    = Get-ChildItem -Recurse -Filter "Inter-Bold.ttf"    inter_tmp | Select-Object -First 1
          Copy-Item $regular.FullName assets/fonts/Inter-Regular.ttf
          Copy-Item $bold.FullName    assets/fonts/Inter-Bold.ttf

      - name: Configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pop-maker-studio-windows
          path: |
            build/Release/pop-maker-studio.exe
            build/Release/ml_pipeline.py
