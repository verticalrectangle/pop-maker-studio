name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            libglfw3-dev \
            libgl1-mesa-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev \
            ffmpeg \
            libfreetype6-dev \
            libaubio-dev \
            libfftw3-dev \
            xxd

      - name: Install whisper.cpp
        run: |
          git clone --depth 1 --branch v1.8.4 https://github.com/ggerganov/whisper.cpp.git /tmp/whisper
          cmake -S /tmp/whisper -B /tmp/whisper/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF
          cmake --build /tmp/whisper/build --parallel
          sudo cmake --install /tmp/whisper/build
          sudo ldconfig

      - name: Install onnxruntime
        run: |
          curl -sL https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz -o /tmp/ort.tgz
          tar -xzf /tmp/ort.tgz -C /tmp/
          sudo mkdir -p /usr/include/onnxruntime
          sudo cp -r /tmp/onnxruntime-linux-x64-1.20.1/include/* /usr/include/onnxruntime/
          sudo cp -r /tmp/onnxruntime-linux-x64-1.20.1/lib/* /usr/lib/
          sudo ldconfig

      - name: Download Inter font
        run: |
          curl -sL "https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip" -o /tmp/inter.zip
          unzip -jo /tmp/inter.zip "*/Inter-Regular.ttf" "*/Inter-Bold.ttf" -d assets/fonts/

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: build-log.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pop-maker-studio-linux
          path: |
            build/pop-maker-studio
            build/ml_pipeline.py
