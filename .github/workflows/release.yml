name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch imgui
        run: |
          rm -rf vendor/imgui
          git clone --depth=1 -b docking https://github.com/ocornut/imgui.git vendor/imgui

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libgl-dev libglfw3-dev \
            ffmpeg \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev \
            libfreetype6-dev \
            libaubio-dev \
            libfftw3-dev \
            libvterm-dev \
            libturbojpeg0-dev \
            pkg-config \
            curl

      - name: Install ONNX Runtime
        run: |
          ORT_VERSION=1.17.3
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            | tar -xz -C /opt
          ln -s "/opt/onnxruntime-linux-x64-${ORT_VERSION}" /opt/onnxruntime
          echo "PKG_CONFIG_PATH=/opt/onnxruntime/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=/opt/onnxruntime" >> "$GITHUB_ENV"

      - name: Build whisper.cpp
        run: |
          git clone --depth=1 https://github.com/ggerganov/whisper.cpp vendor/whisper.cpp || true
          cmake -S vendor/whisper.cpp -B vendor/whisper.cpp/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF
          cmake --build vendor/whisper.cpp/build --parallel
          sudo cmake --install vendor/whisper.cpp/build

      - name: Build pop-maker-studio
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONNXRUNTIME_ROOT=/opt/onnxruntime
          cmake --build build --parallel

      - name: Build export-hubert
        run: cmake --build build --target export-hubert --parallel

      - name: Download models
        run: |
          mkdir -p release/models/piper release/vision-models
          BASE="https://huggingface.co/verticalrectangle/pop-maker-studio-models/resolve/main"

          echo "Downloading all models from pop-maker-studio-models..."
          curl -fsSL -o release/models/ggml-large-v3-turbo-q5_0.bin     "${BASE}/whisper/ggml-large-v3-turbo-q5_0.bin"
          curl -fsSL -o release/models/ggml-tiny.en.bin                 "${BASE}/whisper/ggml-tiny.en.bin"
          curl -fsSL -o release/models/Kim_Vocal_2.onnx                 "${BASE}/separation/Kim_Vocal_2.onnx"
          curl -fsSL -o release/models/u2netp_human_seg.onnx            "${BASE}/background/u2netp_human_seg.onnx"
          curl -fsSL -o release/models/hubert.onnx                      "${BASE}/hubert/hubert.onnx"
          curl -fsSL -o release/models/rmvpe.onnx                       "${BASE}/rvc/rmvpe.onnx"
          curl -fsSL -o release/models/wav2vec2_ctc.onnx                "${BASE}/alignment/wav2vec2_ctc.onnx"
          curl -fsSL -o release/models/wav2vec2_vocab.json              "${BASE}/alignment/wav2vec2_vocab.json"

          curl -fsSL -o release/vision-models/moondream-encoder.onnx    "${BASE}/vision/vision_encoder_q4.onnx"
          curl -fsSL -o release/vision-models/embed_tokens.onnx         "${BASE}/vision/embed_tokens_q4.onnx"
          curl -fsSL -o release/vision-models/moondream-decoder.onnx    "${BASE}/vision/decoder_model_merged_q4.onnx"
          curl -fsSL -o release/vision-models/moondream-tokenizer.json  "${BASE}/vision/tokenizer.json"

          for VOICE in en_US-amy-medium en_US-ryan-medium en_US-lessac-medium en_GB-alan-medium; do
            for EXT in onnx onnx.json; do
              curl -fsSL -o "release/models/piper/${VOICE}.${EXT}" \
                "${BASE}/piper/${VOICE}.${EXT}"
            done
          done

          curl -fsSL -o release/models/rvc_pitch_bases.bin              "${BASE}/rvc/rvc_pitch_bases.bin"

          echo "All models downloaded from single HF repo."

      - name: Package release
        run: |
          # Two assets to stay under GitHub's 2 GB per-file limit:
          #   app + core models (~1.6 GB), vision models (~1.5 GB).
          # Both extract into the same directory:
          #   tar -xzf pop-maker-studio-linux-x86_64.tar.gz
          #   tar -xzf pop-maker-studio-vision-models.tar.gz
          mkdir -p pop-maker-studio
          cp build/pop-maker-studio pop-maker-studio/pop-maker-studio
          cp -r release/models pop-maker-studio/models
          tar -czf pop-maker-studio-linux-x86_64.tar.gz pop-maker-studio/

          rm -rf pop-maker-studio
          mkdir -p pop-maker-studio/models
          cp release/vision-models/* pop-maker-studio/models/
          tar -czf pop-maker-studio-vision-models.tar.gz pop-maker-studio/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pop-maker-studio-linux-x86_64.tar.gz
            pop-maker-studio-vision-models.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
